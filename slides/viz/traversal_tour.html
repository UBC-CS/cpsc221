<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traversal Tour</title>
<!--
  Lecture 16. A pointer walks the Euler tour of a binary tree, left to right,
  passing every node three times: on its left (pre), underneath between the
  two subtrees (in), and on its right (post). Missing children get a short
  stub, so the three passes always happen. Pick one pass and the node
  "squawks" there -- flashes, beeps, and joins the output.

  Keys: -> or Enter step | P play/pause | 1 pre, 2 in, 3 post | T next tree | R reset
  ?tree=0|1|2 &mode=pre|in|post picks the starting tree and pass; &finish=1 runs it all.
-->
<style>
  :root { --ink:#1a1a1a; --muted:#5a6677; --pre:#d1495b; --in:#2e86ab; --post:#3c9d5a; --bg:#fbfaf7; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif; overflow:hidden; }
  .wrap { display:flex; flex-direction:column; height:100%; padding:14px 22px; box-sizing:border-box; gap:10px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .bar .sep { width:14px; }
  button { font:inherit; font-size:clamp(15px,2vh,22px); padding:.3em .9em; border-radius:8px;
           border:1.5px solid #c9ced6; background:#fff; color:var(--ink); cursor:pointer; }
  button:hover { border-color:#8a94a3; }
  button.on { color:#fff; border-color:transparent; }
  button.pre.on { background:var(--pre); } button.in.on { background:var(--in); } button.post.on { background:var(--post); }
  button.go.on { background:var(--ink); }
  .label { font-size:clamp(14px,1.8vh,20px); color:var(--muted); }
  #stage { flex:1; min-height:0; }
  svg { width:100%; height:100%; display:block; }
  .out { font-family: "SF Mono", Menlo, monospace; font-size:clamp(22px,3.6vh,40px); min-height:1.4em; letter-spacing:.04em; }
  .out .name { font-family:inherit; font-size:.6em; color:var(--muted); margin-right:.6em; letter-spacing:0; }
  .hint { font-size:clamp(12px,1.5vh,16px); color:#8a94a3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="label">Squawk at:</span>
    <button class="pre"  data-mode="pre">Pre</button>
    <button class="in"   data-mode="in">In</button>
    <button class="post" data-mode="post">Post</button>
    <span class="sep"></span>
    <button class="go" id="play">Play</button>
    <button id="step">Step</button>
    <button id="reset">Reset</button>
    <span class="sep"></span>
    <button id="tree">Next tree</button>
    <button id="sound">Sound: on</button>
  </div>
  <div id="stage"><svg id="svg"></svg></div>
  <div class="out" id="out"></div>
  <div class="hint">→ step · P play · 1 pre · 2 in · 3 post · T next tree · R reset</div>
</div>

<script>
// ---------------------------------------------------------------- trees
// [label, left, right]; null for a missing child.
const TREES = [
  ["+", ["−", null, ["/", ["b"], ["c"]]], ["*", ["d"], ["e"]]],
  ["10", ["12", ["3"], ["9", null, ["7"]]], ["15", null, ["20", ["30"], ["8"]]]],
  ["a", ["b", ["d"], ["f"]], ["c", null, ["e", ["i", null, ["j"]], ["h"]]]],
];
const NAMES = { pre: "Preorder", in: "Inorder", post: "Postorder" };

const params = new URLSearchParams(location.search);
let treeIdx = Math.min(TREES.length - 1, Math.max(0, parseInt(params.get("tree") || "0", 10) || 0));
let mode = ["pre", "in", "post"].includes(params.get("mode")) ? params.get("mode") : "pre";
let sound = true;

const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const R = 24;            // node radius (in layout units)
const DX = 70, DY = 95;  // spacing

let nodes, stops, cursor, playing, timer, anim;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}

// ---------------------------------------------------------------- layout
// x from inorder position, y from depth.
function layout(t) {
  nodes = [];
  let i = 0;
  (function walk(n, d, parent) {
    if (!n) return null;
    const node = { label: n[0], depth: d, parent };
    node.left = walk(n[1], d + 1, node);
    node.x = (i++) * DX;
    node.right = walk(n[2], d + 1, node);
    node.y = d * DY;
    nodes.push(node);
    return node;
  })(t, 0, null);
  return nodes.find(n => !n.parent);
}

// The tour: a list of stops. A stop is a point the pointer moves to; stops at
// a node carry the pass (pre/in/post) so the node can squawk there.
function buildTour(root) {
  stops = [];
  const off = R + 14;
  (function tour(n) {
    stops.push({ x: n.x - off, y: n.y, node: n, pass: "pre" });
    if (n.left) tour(n.left); else stub(n, -1);
    stops.push({ x: n.x, y: n.y + off, node: n, pass: "in" });
    if (n.right) tour(n.right); else stub(n, +1);
    stops.push({ x: n.x + off, y: n.y, node: n, pass: "post" });
  })(root);
  function stub(n, side) {         // a short bump toward the empty child
    stops.push({ x: n.x + side * DX * 0.42, y: n.y + DY * 0.55, stub: true });
  }
}

// ---------------------------------------------------------------- drawing
let gTrail, gTree, pointer, outEl = document.getElementById("out");
let visited = [];

function draw() {
  svg.innerHTML = "";
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const pad = 70;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad + 30;
  svg.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);

  // null stubs, faint
  for (const n of nodes) for (const side of [-1, 1]) {
    if ((side < 0 ? n.left : n.right)) continue;
    el("line", { x1: n.x + side * R * 0.6, y1: n.y + R * 0.8, x2: n.x + side * DX * 0.42, y2: n.y + DY * 0.55,
                 stroke: "#c9ced6", "stroke-width": 2, "stroke-dasharray": "3 4" });
  }
  // edges
  for (const n of nodes) for (const c of [n.left, n.right]) if (c)
    el("line", { x1: n.x, y1: n.y, x2: c.x, y2: c.y, stroke: "#1a1a1a", "stroke-width": 2.5 });
  gTrail = el("g", {});
  gTree = el("g", {});
  for (const n of nodes) {
    n.g = el("g", {}, gTree);
    n.circle = el("circle", { cx: n.x, cy: n.y, r: R, fill: "#fff", stroke: "#1a1a1a", "stroke-width": 2.5 }, n.g);
    n.text = el("text", { x: n.x, y: n.y + 9, "text-anchor": "middle", "font-size": 26,
                          "font-family": "SF Mono, Menlo, monospace", fill: "#1a1a1a" }, n.g);
    n.text.textContent = n.label;
  }
  pointer = el("circle", { r: 11, fill: "#1a1a1a", cx: stops[0].x, cy: stops[0].y });
}

function renderOut() {
  outEl.innerHTML = `<span class="name">${NAMES[mode]}:</span>` +
    visited.map(n => `<span>${n.label}</span>`).join(" ");
}

function setModeButtons() {
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  pointer && pointer.setAttribute("fill", "var(--" + mode + ")");
}

// ---------------------------------------------------------------- sound
let actx = null;
function squawk() {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    const f = { pre: 660, in: 520, post: 400 }[mode];
    o.type = "square"; o.frequency.setValueAtTime(f, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f * 1.6, actx.currentTime + 0.09);
    g.gain.setValueAtTime(0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.16);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.17);
  } catch (e) {}
}

function flash(n) {
  const color = getComputedStyle(document.documentElement).getPropertyValue("--" + mode).trim();
  n.circle.setAttribute("fill", color);
  n.text.setAttribute("fill", "#fff");
  n.circle.animate([{ transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }],
                   { duration: 320, easing: "ease-out" });
  n.circle.style.transformOrigin = `${n.x}px ${n.y}px`;
  n.circle.style.transformBox = "view-box";
}

// ---------------------------------------------------------------- stepping
function arrive(s) {
  if (s.node && s.pass === mode) {
    visited.push(s.node); flash(s.node); squawk(); renderOut();
  }
}

function step() {
  if (anim) return;                       // finish the move in flight first
  if (cursor >= stops.length - 1) { stop(); return; }
  const a = stops[cursor], b = stops[cursor + 1];
  el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "var(--" + mode + ")", "stroke-width": 3,
               "stroke-dasharray": "7 6", opacity: 0.75 }, gTrail);
  const t0 = performance.now(), dur = playing ? 360 : 260;
  anim = true;
  (function frame(t) {
    const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
    pointer.setAttribute("cx", a.x + (b.x - a.x) * e);
    pointer.setAttribute("cy", a.y + (b.y - a.y) * e);
    if (k < 1) requestAnimationFrame(frame);
    else { anim = false; cursor++; arrive(b); if (cursor >= stops.length - 1) stop(); }
  })(t0);
}

function play() {
  if (cursor >= stops.length - 1) reset();
  playing = true; document.getElementById("play").classList.add("on");
  document.getElementById("play").textContent = "Pause";
  clearInterval(timer); timer = setInterval(step, 420);
}
function stop() {
  playing = false; clearInterval(timer);
  const b = document.getElementById("play"); b.classList.remove("on"); b.textContent = "Play";
}
function reset() {
  stop(); anim = false; visited = [];
  const root = layout(TREES[treeIdx]);
  buildTour(root); cursor = 0; draw(); setModeButtons(); renderOut();
  arrive(stops[0]);                        // the root's pre-visit is at the start
}

// ---------------------------------------------------------------- controls
document.querySelectorAll("[data-mode]").forEach(b =>
  b.addEventListener("click", () => { mode = b.dataset.mode; reset(); }));
document.getElementById("play").addEventListener("click", () => playing ? stop() : play());
document.getElementById("step").addEventListener("click", () => { stop(); step(); });
document.getElementById("reset").addEventListener("click", reset);
document.getElementById("tree").addEventListener("click", () => { treeIdx = (treeIdx + 1) % TREES.length; reset(); });
document.getElementById("sound").addEventListener("click", e => {
  sound = !sound; e.target.textContent = "Sound: " + (sound ? "on" : "off"); });

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const handled = { "arrowright": () => { stop(); step(); }, "enter": () => { stop(); step(); },
    "p": () => playing ? stop() : play(), "r": reset,
    "1": () => { mode = "pre"; reset(); }, "2": () => { mode = "in"; reset(); }, "3": () => { mode = "post"; reset(); },
    "t": () => { treeIdx = (treeIdx + 1) % TREES.length; reset(); } }[k];
  if (handled) { handled(); e.preventDefault(); e.stopPropagation(); }
});

reset();

// ?finish=1 runs the whole tour at once (for checking the output order).
if (params.get("finish")) {
  while (cursor < stops.length - 1) {
    const a = stops[cursor], b = stops[cursor + 1];
    el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "var(--" + mode + ")", "stroke-width": 3,
                 "stroke-dasharray": "7 6", opacity: 0.75 }, gTrail);
    cursor++; pointer.setAttribute("cx", b.x); pointer.setAttribute("cy", b.y); arrive(b);
  }
}
</script>
</body>
</html>
